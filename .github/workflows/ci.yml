name: CI

# Run this workflow on every push and every pull request
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Spin up a real Postgres database just for this test run.
    # It lives only for the duration of the job, then disappears.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance_user
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        # Wait for Postgres to actually be ready before tests start,
        # instead of racing it and failing with a connection error.
        options: >-
          --health-cmd="pg_isready -U finance_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      FLASK_APP: "app:create_app"
      FLASK_ENV: testing
      TEST_DATABASE_URL: postgresql://finance_user:devpassword@localhost:5432/finance_test
      JWT_SECRET_KEY: ci-test-secret
      SECRET_KEY: ci-test-secret

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # speeds up future runs by caching installed packages

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v